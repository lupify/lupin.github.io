<!-- Set the theme before first paint: stored choice > system preference > dark. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.dataset.theme = stored;
        return;
      }
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      document.documentElement.dataset.theme = mq.matches ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();

  // Animation preference: an explicit choice wins, otherwise follow the system
  // reduced-motion setting, otherwise on.
  (function () {
    var v = 'on';
    try {
      var stored = localStorage.getItem('anim');
      if (stored === 'on' || stored === 'off') v = stored;
      else if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) v = 'off';
    } catch (e) {}
    document.documentElement.dataset.anim = v;
  })();
</script>
